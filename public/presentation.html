        bodyHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1">
            ${data.bms.map(b => `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                <div>
                  <div class="flex items-center gap-2 mb-1.5">
                    <span class="text-xs font-black text-white bg-blue-600 px-2 py-0.5 rounded">${b.num}</span>
                    <h4 class="text-sm font-bold text-white">${b.title}</h4>
                  </div>
                  <p class="text-xs text-slate-400 leading-relaxed mb-3">${b.desc}</p>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-850 flex items-center justify-between text-[11px]">
                  <span class="text-slate-400">타겟: <strong class="text-slate-200">${b.target}</strong></span>
                  <span class="text-blue-400 font-bold">${b.profit}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (data.stacks) {
        bodyHtml = `
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 flex-1">
            ${data.stacks.map(st => `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                <div>
                  <h4 class="text-xs font-bold text-white pb-2 border-b border-slate-800 mb-3">${st.category}</h4>
                  <div class="space-y-1.5 mb-3">
                    ${st.techs.map(t => `<div class="bg-slate-950 text-center py-1 rounded text-xs font-semibold text-slate-200 border border-slate-850">${t}</div>`).join('')}
                  </div>
                  <p class="text-[11px] text-slate-400 leading-relaxed">${st.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (data.roadmap) {
        bodyHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 flex-1">
            ${data.roadmap.map(rm => `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col">
                <div class="${rm.color} p-2 text-center text-xs font-bold text-white">
                  ${rm.phase}  |  ${rm.timeline}
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between">
                  <h4 class="text-sm font-bold text-white mb-3 text-center">${rm.title}</h4>
                  <ul class="space-y-2 text-xs text-slate-300">
                    ${rm.items.map(it => `<li class="flex items-start gap-1.5"><span class="text-emerald-400">✔</span><span>${it}</span></li>`).join('')}
                  </ul>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      viewport.innerHTML = `
        <div class="w-full h-full bg-slate-950 p-6 sm:p-10 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="px-2.5 py-0.5 rounded text-[11px] font-bold bg-blue-950 text-blue-400 border border-blue-800/50">
                ${data.category}
              </span>
              <span class="text-xs font-bold text-slate-500">신상픽 SinSangPick</span>
            </div>
            <h3 class="text-xl sm:text-2xl font-black text-white tracking-tight">
              ${data.title}
            </h3>
            <p class="text-xs sm:text-sm text-slate-400 mt-1 mb-4 leading-relaxed">
              ${data.subtitle}
            </p>
          </div>

          ${bodyHtml}

          <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-500">
            <span>신상 먹거리 정보 & 큐레이션 플랫폼 「신상픽」 서비스 소개 및 사업 기획서</span>
            <span>Slide ${idx + 1} / ${slidesData.length}</span>
          </div>
        </div>
      `;
    }

    function goToSlide(idx) {
      if (idx < 0 || idx >= slidesData.length) return;
      currentIdx = idx;
      renderSlide(currentIdx);
    }

    prevBtn.addEventListener('click', () => goToSlide(currentIdx - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentIdx + 1));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goToSlide(currentIdx - 1);
      if (e.key === 'ArrowRight' || e.key === ' ') goToSlide(currentIdx + 1);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Touch swipe for mobile
    let touchStartX = null;
    viewport.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    });
    viewport.addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const touchEndX = e.changedTouches[0].clientX;
      const diff = touchEndX - touchStartX;
      if (diff > 50) goToSlide(currentIdx - 1);
      else if (diff < -50) goToSlide(currentIdx + 1);
      touchStartX = null;
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>

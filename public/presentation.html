<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신상픽(SinSangPick) - 서비스 소개서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .slide-aspect {
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col items-center min-h-screen select-none">

  <!-- Top Simple Navigation Bar -->
  <header class="w-full max-w-5xl px-6 py-4 flex items-center justify-between border-b border-gray-200 bg-white">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-base">
        픽
      </div>
      <div>
        <h1 class="text-sm font-bold text-gray-900 leading-tight">신상픽 (SinSangPick)</h1>
        <p class="text-xs text-gray-500">신상 먹거리 리뷰 & 포인트 리워드 앱</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <span id="slideIndicator" class="text-xs font-semibold px-3 py-1 rounded-full bg-gray-100 text-gray-600 border border-gray-200">
        1 / 3
      </span>
      <a href="/docs/sinsangpick_presentation.pptx" download class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-all shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>PPTX 다운로드</span>
      </a>
      <button id="fullscreenBtn" class="p-1.5 text-gray-500 hover:text-gray-900 bg-gray-50 rounded-lg border border-gray-200" title="전체화면">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
    </div>
  </header>

  <!-- Slide Stage Container -->
  <main class="flex-1 w-full max-w-5xl p-4 sm:p-8 flex flex-col justify-center items-center">
    <!-- White Slide Screen -->
    <div id="slideViewport" class="w-full slide-aspect bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden relative flex flex-col">
      <!-- Injected by JS -->
    </div>

    <!-- Navigation Controls Bottom -->
    <div class="w-full mt-5 flex items-center justify-between text-sm">
      <button id="prevBtn" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-white hover:bg-gray-50 text-gray-700 font-medium border border-gray-200 shadow-sm transition-all active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span>이전</span>
      </button>

      <!-- Dots -->
      <div id="dotsContainer" class="flex items-center gap-2"></div>

      <button id="nextBtn" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-sm transition-all active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
        <span>다음</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <p class="mt-3 text-xs text-gray-400 text-center">
      키보드 방향키(← / →) 또는 스페이스바로 넘길 수 있습니다.
    </p>
  </main>

  <script>
    const slides = [
      // Slide 1
      `
      <div class="w-full h-full p-8 sm:p-14 flex flex-col justify-between bg-white">
        <div>
          <span class="text-xs sm:text-sm font-bold text-blue-600 block mb-2">신상 먹거리 리뷰 & 리워드 앱</span>
          <h2 class="text-3xl sm:text-5xl font-black text-gray-900 tracking-tight">신상픽 (SinSangPick)</h2>
          <p class="mt-4 text-base sm:text-2xl text-gray-700 font-medium leading-relaxed">
            신제품 먹어보고 리뷰 쓰면 포인트 적립!<br>
            모은 포인트로 편의점·카페 e쿠폰(기프티콘) 교환
          </p>
        </div>

        <div class="pt-6 border-t border-gray-100 flex items-center justify-between text-xs sm:text-sm text-gray-400">
          <span>서비스 소개서</span>
          <span>신상픽 (SinSangPick)</span>
        </div>
      </div>
      `,

      // Slide 2
      `
      <div class="w-full h-full p-8 sm:p-12 flex flex-col justify-between bg-white">
        <div>
          <h3 class="text-xl sm:text-2xl font-black text-gray-900">서비스 이용 흐름</h3>
          <p class="text-xs sm:text-sm text-gray-500 mt-1">소비자가 신상품을 구매하고 보상을 받는 3단계 구조</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-auto">
          <!-- Step 1 -->
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5 flex flex-col justify-between">
            <div>
              <span class="text-2xl sm:text-3xl font-black text-blue-600 block mb-2">01</span>
              <h4 class="text-base font-bold text-gray-900 mb-2">신상품 탐색 & 구매</h4>
              <p class="text-xs sm:text-sm text-gray-600 leading-relaxed">
                편의점(CU, GS25, 세븐, 이마트24), 마트의 새로 나온 과자, 음료, 디저트 등 신상 먹거리 확인 및 구매
              </p>
            </div>
          </div>

          <!-- Step 2 -->
          <div class="bg-blue-50/50 border border-blue-200 rounded-2xl p-5 flex flex-col justify-between">
            <div>
              <span class="text-2xl sm:text-3xl font-black text-blue-600 block mb-2">02</span>
              <h4 class="text-base font-bold text-gray-900 mb-2">솔직한 리뷰 등록</h4>
              <p class="text-xs sm:text-sm text-gray-700 leading-relaxed">
                직접 먹어본 맛, 가성비, 사진과 함께 솔직 후기 작성<br>
                <span class="text-blue-600 font-bold mt-1 inline-block">👉 작성 즉시 포인트 적립!</span>
              </p>
            </div>
          </div>

          <!-- Step 3 -->
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5 flex flex-col justify-between">
            <div>
              <span class="text-2xl sm:text-3xl font-black text-blue-600 block mb-2">03</span>
              <h4 class="text-base font-bold text-gray-900 mb-2">e쿠폰 교환</h4>
              <p class="text-xs sm:text-sm text-gray-600 leading-relaxed">
                차곡차곡 모은 포인트로 편의점 모바일 상품권, 스타벅스 커피 쿠폰 등 원하는 e쿠폰 즉시 교환
              </p>
            </div>
          </div>
        </div>

        <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
          <span>신상픽 서비스 이용 흐름</span>
          <span>Slide 2 / 3</span>
        </div>
      </div>
      `,

      // Slide 3
      `
      <div class="w-full h-full p-8 sm:p-12 flex flex-col justify-between bg-white">
        <div>
          <h3 class="text-xl sm:text-2xl font-black text-gray-900">핵심 가치 & 기대효과</h3>
          <p class="text-xs sm:text-sm text-gray-500 mt-1">유저에게는 확실한 혜택을, 플랫폼에는 신뢰할 수 있는 데이터를 만듭니다.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 my-auto">
          <!-- User -->
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6">
            <span class="text-xs font-bold text-blue-600 block mb-1">유저 관점 (User)</span>
            <h4 class="text-lg font-bold text-gray-900 mb-4">실패 없는 소비 & 쏠쏠한 리워드</h4>
            <ul class="space-y-2.5 text-xs sm:text-sm text-gray-700">
              <li class="flex items-start gap-2">
                <span class="text-blue-600 font-bold">•</span>
                <span>광고·협찬 없는 찐후기 보고 신제품 실패 없이 구매</span>
              </li>
              <li class="flex items-start gap-2">
                <span class="text-blue-600 font-bold">•</span>
                <span>내가 먹은 일상 후기 작성하고 포인트 받는 쏠쏠한 앱테크</span>
              </li>
              <li class="flex items-start gap-2">
                <span class="text-blue-600 font-bold">•</span>
                <span>모은 포인트로 편의점 상품권·커피 e쿠폰 무료 교환</span>
              </li>
            </ul>
          </div>

          <!-- Platform -->
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6">
            <span class="text-xs font-bold text-blue-600 block mb-1">서비스 관점 (Platform)</span>
            <h4 class="text-lg font-bold text-gray-900 mb-4">자발적인 찐리뷰 축적 & 활성화</h4>
            <ul class="space-y-2.5 text-xs sm:text-sm text-gray-700">
              <li class="flex items-start gap-2">
                <span class="text-blue-600 font-bold">•</span>
                <span>포인트 보상 시스템으로 고품질 실구매자 리뷰 자발적 누적</span>
              </li>
              <li class="flex items-start gap-2">
                <span class="text-blue-600 font-bold">•</span>
                <span>신제품 궁금한 유저들의 지속적인 방문 및 커뮤니티 활성화</span>
              </li>
              <li class="flex items-start gap-2">
                <span class="text-blue-600 font-bold">•</span>
                <span>축적된 리뷰 데이터를 바탕으로 F&B 제휴 및 e쿠폰 커머스 확장</span>
              </li>
            </ul>
          </div>
        </div>

        <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
          <span>신상픽 핵심 가치 & 기대효과</span>
          <span>Slide 3 / 3</span>
        </div>
      </div>
      `
    ];

    let currentIdx = 0;
    const viewport = document.getElementById('slideViewport');
    const indicator = document.getElementById('slideIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderDots() {
      dotsContainer.innerHTML = '';
      slides.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = `h-2 rounded-full transition-all ${
          i === currentIdx ? 'w-6 bg-blue-600' : 'w-2 bg-gray-300 hover:bg-gray-400'
        }`;
        dot.onclick = () => goToSlide(i);
        dotsContainer.appendChild(dot);
      });
    }

    function renderSlide(idx) {
      indicator.textContent = `${idx + 1} / ${slides.length}`;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === slides.length - 1;
      viewport.innerHTML = slides[idx];
      renderDots();
    }

    function goToSlide(idx) {
      if (idx < 0 || idx >= slides.length) return;
      currentIdx = idx;
      renderSlide(currentIdx);
    }

    prevBtn.addEventListener('click', () => goToSlide(currentIdx - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentIdx + 1));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goToSlide(currentIdx - 1);
      if (e.key === 'ArrowRight' || e.key === ' ') goToSlide(currentIdx + 1);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    renderSlide(0);
  </script>
</body>
</html>

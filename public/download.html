<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>신상픽 앱 다운로드</title>
  <meta name="description" content="편의점·카페·마트 신상 먹거리를 한눈에. 신상픽 앱을 App Store와 Google Play에서 무료로 받아 보세요.">
  <link rel="canonical" href="https://www.sinsangpick.kr/download">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="신상픽">
  <meta property="og:title" content="신상픽 앱 다운로드">
  <meta property="og:description" content="편의점·카페·마트 신상 먹거리를 한눈에. App Store · Google Play에서 무료로 받아 보세요.">
  <meta property="og:image" content="https://www.sinsangpick.kr/logo.png">
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { --primary: #7C3AED; --primary-soft: #F3EEFF; --text: #1F2937; --sub: #4B5563; --muted: #6B7280; --bg: #F8F9FA; --card: #FFFFFF; --border: #E5E7EB; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
    .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px 28px 32px; text-align: center; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08); }
    .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
    .lead { color: var(--sub); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    .store { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-radius: 14px; background: #111; color: #fff; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
    .store:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
    .store:active { transform: translateY(0); }
    .store svg { width: 28px; height: 28px; flex-shrink: 0; }
    .store .label { text-align: left; line-height: 1.2; }
    .store .small { display: block; font-size: 11px; opacity: .8; }
    .store .big { display: block; font-size: 18px; font-weight: 700; }
    .store.recommended { outline: 3px solid var(--primary); outline-offset: 2px; }
    .badge { display: none; margin-left: auto; font-size: 11px; font-weight: 700; background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 999px; }
    .store.recommended .badge { display: inline-block; }
    .features { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .feature { font-size: 12px; color: var(--sub); line-height: 1.4; }
    .feature b { display: block; font-size: 20px; margin-bottom: 4px; }
    footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 16px 32px; }
    footer a { color: var(--muted); margin: 0 8px; }
    @media (max-width: 380px) { .card { padding: 32px 20px 24px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="icon" src="/app-icon.png" alt="신상픽 앱 아이콘" width="96" height="96">
      <h1>신상픽 앱 받기</h1>
      <p class="lead">편의점·카페·마트에 새로 나온 먹거리를<br>가장 빠르게 만나 보세요.</p>

      <div class="stores">
        <a class="store" id="ios" href="https://apps.apple.com/kr/iphone/search?term=%EC%8B%A0%EC%83%81%ED%94%BD" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.76 2.28-1.6 2.78-.41 6.9 1.15 9.15.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.84c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.27z"/></svg>
          <span class="label"><span class="small">Download on the</span><span class="big">App Store</span></span>
          <span class="badge">내 기기</span>
        </a>
        <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.sinsangpick.app&amp;hl=ko" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.2c-.2.2-.35.55-.35 1v17.6c0 .45.15.8.35 1l.05.05 9.85-9.85v-.23L3.65 2.15z"/><path fill="#FBBC04" d="M16.8 15.3l-3.3-3.3v-.23l3.3-3.3.07.04 3.9 2.22c1.12.63 1.12 1.67 0 2.3l-3.9 2.22z"/><path fill="#EA4335" d="M16.87 15.26L13.5 11.9 3.6 21.8c.37.39.97.44 1.65.05l11.62-6.6"/><path fill="#4285F4" d="M16.87 8.53L5.25 1.93c-.68-.39-1.28-.34-1.65.05l9.9 9.9z"/></svg>
          <span class="label"><span class="small">GET IT ON</span><span class="big">Google Play</span></span>
          <span class="badge">내 기기</span>
        </a>
      </div>

      <div class="features">
        <div class="feature"><b>🆕</b>매일 업데이트<br>신상 먹거리</div>
        <div class="feature"><b>⭐</b>직접 먹어본<br>솔직 리뷰</div>
        <div class="feature"><b>🏷️</b>편의점·마트<br>할인 소식</div>
      </div>
    </div>
  </main>
  <footer>
    <a href="/">웹에서 보기</a>
    <a href="/about">서비스 소개</a>
    <a href="/privacy">개인정보처리방침</a>
  </footer>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var el = isIOS ? document.getElementById('ios') : isAndroid ? document.getElementById('android') : null;
      if (el) {
        el.classList.add('recommended');
        el.parentNode.insertBefore(el, el.parentNode.firstChild);
      }
    })();
  </script>
</body>
</html>

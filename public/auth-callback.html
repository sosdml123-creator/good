<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>신상픽 - 로그인 완료</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/app-icon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF;
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.04);
      animation: appear 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes appear {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .logo-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      margin: 0 auto 20px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 4px;
      box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: #059669;
      background: #ECFDF5;
      padding: 5px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .badge svg {
      width: 14px;
      height: 14px;
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #0F172A;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #64748B;
      line-height: 1.55;
      margin-bottom: 24px;
      word-break: keep-all;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      background: #0F172A;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #000000;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s;
    }
    .btn-secondary:hover {
      color: #475569;
    }
    .tip {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      <img src="/logo.png" alt="신상픽" />
    </div>

    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>로그인 인증 완료</span>
    </div>

    <h1>신상픽 앱으로 이동 중...</h1>
    <p>
      로그인이 성공적으로 완료되었습니다.<br />
      신상픽 앱으로 돌아가 서비스를 계속 이용하세요.
    </p>

    <button id="open-app-btn" class="btn-primary">
      <span>신상픽 앱 열기</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>

    <a href="/" class="btn-secondary">웹 브라우저에서 계속 이용하기</a>

    <div class="tip">
      화면이 자동으로 넘어가지 않으면 <strong>[신상픽 앱 열기]</strong>를 탭해주세요.
    </div>
  </div>

  <script>
    (function() {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var deepLink = 'sinsangpick://auth-callback' + search + hash;

      var btn = document.getElementById('open-app-btn');
      if (btn) {
        btn.onclick = function() {
          window.location.href = deepLink;
        };
      }

      // Check if on mobile device
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));

      if (isMobile) {
        // Attempt immediate auto-redirect to app
        setTimeout(function() {
          try {
            window.location.href = deepLink;
          } catch(e) {}
        }, 150);
      }
    })();
  </script>
</body>
</html>

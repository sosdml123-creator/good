<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002D80" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow border -->
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />

  <!-- Stylized 'N' + Pick Arrow & Sparkle -->
  <g filter="url(#glow)">
    <!-- Main 'N' Body -->
    <path 
      d="M32 86V38C32 35.2 34.2 33 37 33C39.8 33 42 35.2 42 38V68L71.5 35.2C73 33.5 75.3 32.7 77.5 33.2C79.8 33.8 81.5 35.7 81.8 38C82 39.5 82 82 82 82C82 84.8 79.8 87 77 87C74.2 87 72 84.8 72 82V52L42.5 84.8C41 86.5 38.7 87.3 36.5 86.8C34.2 86.2 32 84 32 86Z" 
      fill="url(#nGrad)"
    />

    <!-- Dynamic Pick Accent / Overlay -->
    <path 
      d="M48 64L62 78L92 48" 
      stroke="#38BDF8" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Sparkle Star on top right of N -->
    <path 
      d="M88 28C88 33 93 36 98 36C93 36 88 39 88 44C88 39 83 36 78 36C83 36 88 33 88 28Z" 
      fill="url(#sparkGrad)"
    />
    <circle cx="88" cy="36" r="1.5" fill="#FFFFFF" />
  </g>
</svg>

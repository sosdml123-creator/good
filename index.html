<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>신상픽 (SinSangPick) - 식음료 신제품 발견 & 솔직 리뷰</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="description" content="새로 나온 먹거리를 가장 먼저 발견하고, 먹어본 사람들의 솔직한 평가를 확인하는 신상 식음료 리뷰 플랫폼" />
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          if ((hash.indexOf('access_token=') !== -1 || search.indexOf('code=') !== -1) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
            if (isMobile) {
              window.location.href = 'sinsangpick://auth-callback' + search + hash;
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>

  <body class="bg-white text-gray-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

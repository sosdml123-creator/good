    <script>
      (function(){try{var n=/^(capacitor:|ionic:)$/.test(location.protocol)||((location.hostname==="localhost"||location.hostname==="127.0.0.1")&&!location.port)||(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());if(n)document.documentElement.classList.add("native-app");if(!["/","/index.html","/pc.html"].includes(location.pathname)||location.search||location.hash)document.documentElement.classList.add("app-route");}catch(e){}})();
    </script>
    <style>html.native-app #web-editorial,html.toss-app #web-editorial,html.app-route #web-editorial{display:none!important}</style>
    <script>
      // PC(데스크톱)에서 www로 들어오면 같은 경로의 PC 버전(pc.sinsangpick.kr)으로 이동.
      // 모바일·앱·로그인 콜백은 그대로. ?mobile=1 로 들어오면 이 브라우저에서는 이동하지 않음 (?mobile=0 으로 해제).
      (function() {
        try {
          var loc = window.location;
          if (loc.hostname !== 'www.sinsangpick.kr' && loc.hostname !== 'sinsangpick.kr') return;
          if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
          if (/^\/(?:guide(?:\/|$)|about(?:\.html)?$|editorial-policy(?:\.html)?$|contact(?:\.html)?$|privacy(?:\.html)?$|terms(?:\.html)?$|location(?:-policy\.html)?$|delete-account(?:\.html)?$|download(?:\.html)?$|presentation(?:\.html)?$)/.test(loc.pathname)) return;
          var ua = navigator.userAgent || '';
          var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua));
          if (isMobile) return;
          if (/(Yeti|bot|crawler|spider)/i.test(ua)) return;
          var q = loc.search || '';
          try {
            if (/[?&]mobile=1/.test(q)) localStorage.setItem('sinsangpick_stay_mobile', '1');
            if (/[?&]mobile=0/.test(q)) localStorage.removeItem('sinsangpick_stay_mobile');
            if (localStorage.getItem('sinsangpick_stay_mobile') === '1') return;
          } catch (e) {}
          var h = loc.hash || '';
          if (h.indexOf('access_token=') !== -1 || q.indexOf('code=') !== -1 || loc.pathname.indexOf('auth-callback') !== -1) return;
          loc.replace('https://pc.sinsangpick.kr' + loc.pathname + q + h);
        } catch (e) {}
      })();
    </script>

    <script>
      // 앱이 쓰지 않는 주소(/asdf 등)도 홈 화면이 200으로 떠서 구글이 'Soft 404'로 분류합니다.
      // 알려진 주소가 아니면 색인하지 않도록 noindex 를 붙입니다. (/product/:id 와 정적 문서는 서버가 따로 처리)
      (function() {
        try {
          var p = window.location.pathname.replace(/\/+$/, '').toLowerCase();
          var known = ['', '/index.html', '/pc.html', '/privacy', '/terms', '/location', '/delete-account'];
          if (known.indexOf(p) !== -1 || /^\/product\/[^/]+$/.test(p)) return;
          var m = document.createElement('meta');
          m.name = 'robots';
          m.content = 'noindex';
          document.head.appendChild(m);
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var hasAuth = (hash.indexOf('access_token=') !== -1 || search.indexOf('code=') !== -1 || window.location.pathname.indexOf('auth-callback') !== -1);
          // 이 브라우저에서 직접 시작한 웹 로그인이면 앱으로 넘기지 않고 웹에서 로그인을 마칩니다.
          var webOAuthAt = 0;
          try { webOAuthAt = parseInt(localStorage.getItem('sinsangpick_web_oauth_at') || '0', 10) || 0; } catch(e) {}
          var startedOnWeb = webOAuthAt > 0 && (Date.now() - webOAuthAt) < 15 * 60 * 1000;
          if (startedOnWeb) {
            try { sessionStorage.removeItem('sinsangpick_auth_callback_url'); } catch(e) {}
          }
          if (hasAuth && !startedOnWeb && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
            var fullUrl = 'sinsangpick://auth-callback' + search + hash;
            window.__SINSANGPICK_AUTH_URL__ = fullUrl;
            try { sessionStorage.setItem('sinsangpick_auth_callback_url', fullUrl); } catch(e) {}
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
            if (isMobile) {
              window.location.href = fullUrl;
            }
          }
        } catch(e) {}
      })();
    </script>

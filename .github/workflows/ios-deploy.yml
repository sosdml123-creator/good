name: iOS App Store Deploy

on:
  # 자동 실행 없음: 앱 업로드가 필요할 때만 Actions 탭에서 Run workflow로 수동 실행
  workflow_dispatch:

# 새 실행이 들어오면 같은 브랜치의 진행 중인 이전 빌드를 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Upload iOS App to App Store Connect
    runs-on: macos-15
    # 멈춘 단계가 기본 6시간 동안 macOS 분을 쓰지 않도록 상한을 둔다
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PP_PLIST=$(security cms -D -i $PP_PATH)

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PP_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PP_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< "$PP_PLIST")

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          echo "Profile UUID : $PROFILE_UUID"
          echo "Profile Name : $PROFILE_NAME"
          echo "Team ID      : $TEAM_ID"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

          if echo "$PP_PLIST" | grep -q "com.apple.developer.applesignin"; then
            echo "HAS_APPLE_SIGNIN=true" >> $GITHUB_ENV
            echo "Profile includes Sign In with Apple"
          else
            echo "HAS_APPLE_SIGNIN=false" >> $GITHUB_ENV
            echo "Profile does NOT include Sign In with Apple"
          fi

          if echo "$PP_PLIST" | grep -q "aps-environment"; then
            echo "HAS_PUSH=true" >> $GITHUB_ENV
            echo "Profile includes Push Notifications"
          else
            echo "HAS_PUSH=false" >> $GITHUB_ENV
            echo "Profile does NOT include Push Notifications"
          fi

      - name: Generate ExportOptions.plist
        run: |
          EXPORT_PLIST="$GITHUB_WORKSPACE/ios/App/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store" \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string 'Apple Distribution'" \
            -c "Add :destination string export" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.sinsangpick.app string $PROFILE_UUID" \
            "$EXPORT_PLIST"
          echo "=== ExportOptions.plist ==="
          cat "$EXPORT_PLIST"

      - name: Build Archive (xcodebuild)
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/app-signing.keychain-db
          security default-keychain -s $RUNNER_TEMP/app-signing.keychain-db
          security list-keychains -d user -s $RUNNER_TEMP/app-signing.keychain-db \
            $(security list-keychains -d user | tr -d '"')

          cd ios/App

          if [ "$HAS_APPLE_SIGNIN" = "true" ]; then
            ENTITLEMENTS="$GITHUB_WORKSPACE/ios/App/App/App.entitlements"
            echo "Using full entitlements"
          else
            ENTITLEMENTS="$RUNNER_TEMP/App-CI.entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" \
              -c "Add :application-identifier string $TEAM_ID.com.sinsangpick.app" \
              "$ENTITLEMENTS" || true
            echo "Using minimal entitlements (no Apple Sign In)"
          fi

          # 푸시 권한은 프로비저닝 프로파일에 포함된 경우에만 추가 (미포함 시 서명 실패 방지)
          if [ "$HAS_PUSH" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS" || true
            echo "Added aps-environment entitlement (Push Notifications)"
          fi

          # 빌드 번호는 실행 번호로 고정 (기존 agvtool 호출은 `|| true`로 실패가 가려져 있었음)
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
            -allowProvisioningUpdates

      - name: Export IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/app-signing.keychain-db
          security default-keychain -s $RUNNER_TEMP/app-signing.keychain-db
          security list-keychains -d user -s $RUNNER_TEMP/app-signing.keychain-db \
            $(security list-keychains -d user | tr -d '"')

          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/App/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(find "$GITHUB_WORKSPACE/build/ipa" -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
